<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav>
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL | relURL }}"{{ if or ($current.IsMenuCurrent "main" .) (eq $current.RelPermalink .URL) (hasPrefix $current.RelPermalink .URL) }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
