<footer class="site-footer">
  <div class="wrap">
    <p class="links">
      <a href="{{ site.Params.linkedin }}">LinkedIn</a>
      {{ with site.Params.email }}<a href="mailto:{{ . }}">Email</a>{{ end }}
      <a href="{{ "index.xml" | relURL }}">RSS</a>
    </p>
    <p class="disclaimer">{{ site.Params.disclaimer }}</p>
    <p class="copy">© {{ now.Year }} {{ site.Title }}</p>
  </div>
</footer>
